onlyBuiltDependencies:
  - puppeteer
  # embedded-postgres platform packages recreate the symlinks of the Postgres
  # binaries in a postinstall step (Linux/macOS); needed for `pnpm test:db`.
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/darwin-arm64"
overrides:
  # next-pwa -> workbox-build -> rollup-plugin-terser pins serialize-javascript 4 (RCE advisory)
  serialize-javascript: ">=7.1.2"
  # Advisories on transitive dependencies (patched releases exist)
  stream-json: ">=3.6.0"
  decode-uri-component: ">=0.5.0"
  webpack: ">=5.105.0"
  "fflate@<0.7.5": ">=0.7.5"
  "dompurify@<=3.4.15": ">=3.4.17"
  # @tailwindcss/typography pins postcss-selector-parser 6.0.10 (quadratic-complexity advisory, fixed in 7.1.6)
  "@tailwindcss/typography>postcss-selector-parser": ">=7.1.7"
