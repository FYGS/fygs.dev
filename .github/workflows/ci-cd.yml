name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token is read-only everywhere; a job that needs more asks for it itself.
# Pull requests run code from their branch: nothing here receives a production secret
# (policy enforced by scripts/ci/check-secrets-in-workflows.mjs, first step of the lint job).
permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  NODE_OPTIONS: '--max_old_space_size=4096'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for the policy check)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Workflow policy (no PR-reachable secret, read-only token, pinned actions)
        run: node scripts/ci/check-secrets-in-workflows.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # pin-exception: tag kept current by Dependabot (github-actions); a SHA is pinned when the maintainers publish one we have verified
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run ESLint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: true

      - name: Run TypeScript check
        run: pnpm tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # pin-exception: tag kept current by Dependabot (github-actions); a SHA is pinned when the maintainers publish one we have verified
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run unit tests
        run: pnpm test:ci
        env:
          NODE_ENV: test
          SKIP_ENV_VALIDATION: "true"

  integration:
    name: Integration Tests (${{ matrix.database }} PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        # embedded: scripts/test-db.mjs boots a throw-away PostgreSQL (same as a laptop).
        # service: the postgres service container below, reached through TEST_DATABASE_URL.
        database: [embedded, service]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fygs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # pin-exception: tag kept current by Dependabot (github-actions); a SHA is pinned when the maintainers publish one we have verified
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test
          SKIP_ENV_VALIDATION: "true"
          TEST_DATABASE_URL: ${{ matrix.database == 'service' && 'postgresql://postgres:password@localhost:5432/fygs_test' || '' }}

      - name: Check that prisma/migrations match schema.prisma
        if: matrix.database == 'embedded'
        run: pnpm db:check-migrations

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test, integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # pin-exception: tag kept current by Dependabot (github-actions); a SHA is pinned when the maintainers publish one we have verified
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      # The build executes code of the branch (next.config.mjs, every module imported at build time). It gets
      # placeholders only: the build does not need a database, a cache or a payment key, and a pull request must
      # never be able to read the real ones.
      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          REDIS_URL: ""
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-32chars!!
          STRIPE_SECRET_KEY: sk_test_ci_build_placeholder
          NEXTAUTH_SECRET: ci-build-placeholder-secret-32chars!!
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          SKIP_ENV_VALIDATION: true

      # Pages inside the nonce areas (lib/csp.mjs) must be rendered per request, or a browser enforcing the policy
      # would block their scripts.
      - name: Nonce areas are not prerendered
        run: node scripts/ci/check-nonce-routes-dynamic.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            .next/
            public/
          retention-days: 1

  e2e:
    name: E2E (Playwright, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # pin-exception: tag kept current by Dependabot (github-actions); a SHA is pinned when the maintainers publish one we have verified
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      # System Chrome driven by Playwright (no browser download): stable channel, path handed to the config.
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1 # pin-exception: tag kept current by Dependabot (github-actions); test job only, no secret in its environment
        with:
          chrome-version: stable

      # The Stripe checkout smoke needs a TEST-mode key. Secrets are not handed to jobs that run the code of a pull
      # request: the smoke only runs on pushes to main/develop (without a key it skips itself). A live key is refused.
      - name: Refuse a live Stripe key
        if: github.event_name == 'push'
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          case "$STRIPE_TEST_KEY" in
            sk_live_*|rk_live_*) echo "::error::STRIPE_TEST_SECRET_KEY holds a LIVE key. Use a test-mode key."; exit 1 ;;
          esac

      # scripts/e2e.mjs: embedded PostgreSQL (real migrations + seed) -> next build -> next start
      # (production, mail capture, offline AI, memory rate limiter) -> Playwright -> teardown.
      - name: Build and run the e2e suite
        run: pnpm test:e2e
        env:
          CI: true
          E2E_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          STRIPE_SECRET_KEY: ${{ github.event_name == 'push' && secrets.STRIPE_TEST_SECRET_KEY || '' }}
          STRIPE_MONTHLY_PRICE_ID: ${{ github.event_name == 'push' && secrets.STRIPE_TEST_MONTHLY_PRICE_ID || '' }}
          STRIPE_YEARLY_PRICE_ID: ${{ github.event_name == 'push' && secrets.STRIPE_TEST_YEARLY_PRICE_ID || '' }}

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
