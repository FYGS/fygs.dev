name: Dependency audit

# Blocking: a known high or critical advisory in the lockfile fails the job, unless .github/audit-allowlist.json carries a
# dated decision for it. Runs on every pull request, on pushes to main/staging/develop, and weekly (new advisories appear without
# any change in the repository).
on:
  pull_request:
    branches: [ main, staging, develop ]
  push:
    branches: [ main, staging, develop ]
  schedule:
    - cron: '0 5 * * 1' # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Lockfile advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Audit the lockfile (high and critical)
        run: node scripts/ci/audit-lockfile.mjs pnpm-lock.yaml --level=high
